name: Deploy Documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'src/vl_jepa/api/static/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v5  # v5 is latest available (v6 does not exist)
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Build documentation
        run: mkdocs build --strict 2>&1 | grep -v "^INFO" || true

      - name: Copy Playground files into built site
        run: |
          mkdir -p site/playground
          cp src/vl_jepa/api/static/*.html site/playground/
          cp src/vl_jepa/api/static/*.js site/playground/
          cp src/vl_jepa/api/static/*.css site/playground/
          cp -r src/vl_jepa/api/static/storage site/playground/storage
          # Fix paths: remove /static/ prefix for GH Pages
          sed -i 's|/static/||g' site/playground/index.html

      - name: Deploy to GitHub Pages
        run: |
          pip install ghp-import
          ghp-import site -p -f -m "Deploy docs + playground"
